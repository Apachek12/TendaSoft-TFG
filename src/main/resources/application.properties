spring.application.name=TendaSoft

# 1. Conexión a tu XAMPP (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/tendasoft?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de Hibernate
# Forzamos el dialecto para que Hibernate sepa hablar "MySQL moderno"
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Estrategia de nombrado (Evita problemas de mayúsculas/minúsculas en Windows/XAMPP)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 4. Logs (Súper útil para tu TFG)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Esto te avisará si hay errores en la creación de las tablas
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE