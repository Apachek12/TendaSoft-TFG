spring.application.name=TendaSoft

# 1. Conexión a tu XAMPP (MySQL)
# Asegúrate de que tu base de datos en phpMyAdmin se llama 'tendasoft'
spring.datasource.url=jdbc:mysql://localhost:3306/tendasoft?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de Hibernate (La magia que crea las tablas)
# 'update' lee tus clases de Java y crea/actualiza las tablas sin borrar los datos
spring.jpa.hibernate.ddl-auto=update

# 3. Mostrar el SQL en la consola (Súper útil para tu TFG para ver qué hace por debajo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
